<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>All in One</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header id="navbar"></header>
    <form id="contactForm">
      <h2>Contact Form</h2>
      <p id="status">Lade SQL.js ...</p>
      <input id="Anrede" placeholder="Herr/Frau/..." required autofocus />
      <input id="Vorname" placeholder="Vorname" required />
      <input id="Nachname" placeholder="Nachname" required />
      <input id="Email" type="email" placeholder="E-Mail" required />
      <button id="btn" disabled>Senden</button>
      <pre id="output"></pre>
      <pre id="preview"></pre>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js"></script>
    <script>
      let db;

      // in browser DB
      initSqlJs({
        locateFile: (file) =>
          `https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/${file}`,
      }).then((SQL) => {
        db = new SQL.Database();
        db.run("CREATE TABLE users (full_name TEXT, email TEXT)");
        document.getElementById("status").textContent = "Bereit";
        document.getElementById("btn").disabled = false;
      });

      document.getElementById("contactForm").addEventListener("submit", (e) => {
        e.preventDefault();

        const anrede = document.getElementById("Anrede").value;
        const vorname = document.getElementById("Vorname").value;
        const nachname = document.getElementById("Nachname").value;
        const email = document.getElementById("Email").value;

        const fullName = `${anrede} ${vorname} ${nachname}`;

        db.run("INSERT INTO users (full_name, email) VALUES (?, ?)", [
          fullName,
          email,
        ]);

        const rows = db
          .exec("SELECT full_name, email FROM users")[0]
          .values.map(([name, mail]) => `${name} <${mail}>`);
        document.getElementById("output").textContent =
          "Gespeichert:\n" + rows.join("\n");

        const greeting = "Sehr geehrter " + fullName;

        document.getElementById("preview").textContent =
          "An: " + email + "\nE-Mail-Anrede: " + greeting;
      });
    </script>

    <script>
      fetch("nav.html")
        .then((res) => res.text())
        .then((html) => (document.getElementById("navbar").innerHTML = html));
    </script>
  </body>
</html>
