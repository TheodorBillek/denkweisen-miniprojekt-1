<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Splitting Name</title>
    <link rel="stylesheet" href="style.css?v=2" />
  </head>

  <body>
    <header id="navbar"></header>
    <form id="contactForm">
      <h2>Contact Form</h2>
      <p id="status">Lade SQL.js ...</p>
      <input id="Anrede" placeholder="Herr/Frau/..." required autofocus />
      <input id="Vorname" placeholder="Vorname" required />
      <input id="Nachname" placeholder="Nachname" required />
      <input id="Email" type="email" placeholder="E-Mail" required />
      <button id="btn" disabled>Senden</button>
      <pre id="preview"></pre>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js"></script>
    <script>
      let db;

      // in browser DB
      initSqlJs({
        locateFile: (file) =>
          `https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/${file}`,
      }).then((SQL) => {
        db = new SQL.Database();
        db.run("CREATE TABLE users (anrede TEXT, name TEXT, email TEXT)");
        document.getElementById("status").textContent = "Bereit";
        document.getElementById("btn").disabled = false;
      });

      document.getElementById("contactForm").addEventListener("submit", (e) => {
        e.preventDefault();

        const anrede = document.getElementById("Anrede").value;
        const vorname_raw = document.getElementById("Vorname").value;
        const nachname_raw = document.getElementById("Nachname").value;
        const email = document.getElementById("Email").value;

        const fullName = `${vorname_raw} ${nachname_raw}`;

        db.run("INSERT INTO users (anrede, name, email) VALUES (?, ?, ?)", [
          anrede,
          fullName,
          email,
        ]);

        const [storedAnrede, storedName, storedMail] = db
          .exec("SELECT anrede, name, email FROM users")[0]
          .values.at(-1);

        
        const vorname = storedName.split(" ")[0];
        const nachname = storedName.split(" ")[1];
        const greeting = `Sehr geehrte${storedAnrede === "Frau" ? "" : "r"} ${storedAnrede} ${vorname} ${nachname}`;

        document.getElementById("preview").textContent =
          `An: ${storedMail}\nE-Mail-Anrede: ${greeting}`;
      });
    </script>

    <script>
      fetch("nav.html")
        .then((res) => res.text())
        .then((html) => (document.getElementById("navbar").innerHTML = html));
    </script>
  </body>
</html>
